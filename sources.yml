# Watch list for scripts/watch.py
# Each source: the public changelog/docs page to diff for changes.
# `selector` is an optional CSS selector to narrow the extracted text (reduces noise).
# If a selector breaks (site redesign), fix it here — no code change needed.
sources:
  - slug: telegram
    name: "Telegram Bot API (Recent changes)"
    url: "https://core.telegram.org/bots/api-changelog"
    selector: "#dev_page_content"

  - slug: tiktok
    name: "TikTok for Developers Changelog"
    url: "https://developers.tiktok.com/doc/changelog/"
    selector: "main, body"

  - slug: youtube
    name: "YouTube Data API Revision History"
    url: "https://developers.google.com/youtube/v3/revision_history"
    selector: "div.devsite-article-body, main"

  - slug: discord
    name: "Discord API Change Log"
    url: "https://discord.com/developers/docs/change-log"
    selector: "main, body"

# Manually-tracked platforms (NOT auto-watched here):
#   - facebook: developers.facebook.com blocks non-browser requests (HTTP 400 from
#     datacenter IPs), so the changelog can't be fetched from CI. Track it by hand
#     in data/facebook.yml. Sunset alerts (scripts/check_sunset.py) still run for it.
#   - zalo-oa: no stable public changelog feed. Track by hand in data/zalo-oa.yml.
