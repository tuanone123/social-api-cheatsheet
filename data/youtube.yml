platform: "YouTube Data API"
slug: youtube
docs: "https://developers.google.com/youtube/v3"
changelog: "https://developers.google.com/youtube/v3/revision_history"
auth: "OAuth 2.0 (Google) or API key; quota-metered"
base_url: "https://www.googleapis.com/youtube/v3"
current_version: "v3"
versioning: true
versions:
  - version: "v3"
    released: "2013-04-19"
    sunset: ""
endpoints:
  - name: "Search"
    method: "GET"
    path: "/search"
    scopes: "-"
    key_fields: "q, part, type, maxResults"
    notes: "Costs 100 quota units per call — use sparingly"
  - name: "List videos"
    method: "GET"
    path: "/videos"
    scopes: "-"
    key_fields: "id, part=snippet,statistics"
    notes: "1 unit + parts; statistics gives view/like counts"
  - name: "Upload video"
    method: "POST"
    path: "/videos (resumable upload)"
    scopes: "https://www.googleapis.com/auth/youtube.upload"
    key_fields: "snippet, status"
    notes: "~1600 quota units; resumable upload protocol"
last_checked: "2026-09-07"
