platform: "Zalo Official Account API"
slug: zalo-oa
docs: "https://developers.zalo.me/docs/official-account"
changelog: "https://developers.zalo.me/docs/official-account"
auth: "OAuth 2.0 access_token (Zalo OA); refreshed via refresh_token"
base_url: "https://openapi.zalo.me"
current_version: "v3.0"
versioning: true
versions:
  - version: "v3.0"
    released: "2022-06-01"
    sunset: ""
endpoints:
  - name: "Send customer-service message"
    method: "POST"
    path: "/v3.0/oa/message/cs"
    scopes: "-"
    key_fields: "recipient.user_id, message.text"
    notes: "Only within the 48h customer-service window"
  - name: "Get OA info"
    method: "GET"
    path: "/v2.0/oa/getoa"
    scopes: "-"
    key_fields: "oa_id, name, num_follower"
    notes: "access_token passed in the `access_token` header"
  - name: "Upload image"
    method: "POST"
    path: "/v2.0/oa/upload/image"
    scopes: "-"
    key_fields: "file (multipart)"
    notes: "Returns attachment_id for use in messages"
last_checked: "2026-09-07"
