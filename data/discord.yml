platform: "Discord API"
slug: discord
docs: "https://discord.com/developers/docs/reference"
changelog: "https://discord.com/developers/docs/change-log"
auth: "Bot token or OAuth2 (`Authorization: Bot <token>`)"
base_url: "https://discord.com/api"
current_version: "v10"
versioning: true
# Discord deprecates old API versions (marked deprecated/discontinued in docs) rather than fixed sunset dates.
versions:
  - version: "v10"
    released: "2022-10-01"
    sunset: ""
  - version: "v9"
    released: "2021-06-01"
    sunset: ""
endpoints:
  - name: "Create message"
    method: "POST"
    path: "/v10/channels/{channel.id}/messages"
    scopes: "bot (SEND_MESSAGES)"
    key_fields: "content, embeds, components"
    notes: "Rate limited per channel; use webhooks for high volume"
  - name: "Get gateway (bot)"
    method: "GET"
    path: "/v10/gateway/bot"
    scopes: "bot"
    key_fields: "url, shards, session_start_limit"
    notes: "Required before opening a gateway WebSocket"
  - name: "Interaction response"
    method: "POST"
    path: "/v10/interactions/{id}/{token}/callback"
    scopes: "-"
    key_fields: "type, data"
    notes: "Must respond within 3s or the interaction fails"
last_checked: "2026-09-07"
