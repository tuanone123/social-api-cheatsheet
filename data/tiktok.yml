platform: "TikTok for Developers"
slug: tiktok
docs: "https://developers.tiktok.com/doc/"
changelog: "https://developers.tiktok.com/doc/changelog/"
auth: "OAuth 2.0 (Login Kit) — access_token + open_id"
base_url: "https://open.tiktokapis.com"
current_version: "v2"
versioning: true
versions:
  - version: "v2"
    released: "2023-06-01"
    sunset: ""
endpoints:
  - name: "Query user info"
    method: "GET"
    path: "/v2/user/info/"
    scopes: "user.info.basic"
    key_fields: "open_id, display_name, avatar_url"
    notes: "Fields requested via `fields` query param"
  - name: "Init video publish"
    method: "POST"
    path: "/v2/post/publish/video/init/"
    scopes: "video.publish"
    key_fields: "post_info, source_info"
    notes: "Content Posting API; returns publish_id"
  - name: "Query creator info"
    method: "POST"
    path: "/v2/post/publish/creator_info/query/"
    scopes: "video.publish"
    key_fields: "creator_username, privacy_level_options"
    notes: "Call before publishing to get allowed settings"
last_checked: "2026-09-07"
