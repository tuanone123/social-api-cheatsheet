platform: "Facebook Graph API"
slug: facebook
docs: "https://developers.facebook.com/docs/graph-api/"
changelog: "https://developers.facebook.com/docs/graph-api/changelog/"
auth: "OAuth 2.0 Access Token (User / Page / App / Client Token)"
base_url: "https://graph.facebook.com"
current_version: "v21.0"
versioning: true
# Sunset = ~2 years after release. VERIFY against the official changelog before trusting.
versions:
  - version: "v21.0"
    released: "2024-10-02"
    sunset: "2026-10-02"
  - version: "v20.0"
    released: "2024-05-21"
    sunset: "2026-05-21"
  - version: "v19.0"
    released: "2024-01-23"
    sunset: "2026-01-23"
  - version: "v18.0"
    released: "2023-09-12"
    sunset: "2025-09-12"
endpoints:
  - name: "Get user profile"
    method: "GET"
    path: "/{version}/{user-id}"
    scopes: "public_profile"
    key_fields: "id, name, picture"
    notes: "email requires the `email` scope + App Review"
  - name: "Publish page post"
    method: "POST"
    path: "/{version}/{page-id}/feed"
    scopes: "pages_manage_posts"
    key_fields: "message, link, published"
    notes: "Needs a Page Access Token, not a User token"
  - name: "Debug token"
    method: "GET"
    path: "/{version}/debug_token"
    scopes: "-"
    key_fields: "input_token, access_token"
    notes: "Inspect scopes / expiry of any token"
last_checked: "2026-09-07"
